services:
  postgres:
    image: postgres:18-alpine
    container_name: veda-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: veda
      POSTGRES_PASSWORD: veda
      POSTGRES_DB: veda
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veda"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: veda-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: ./veda-backend
    container-name: veda-backend
    restart: unless-stopped
    env_file:
      - ./veda-backend/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./veda-frontend
      container-name: veda-frontend
      restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pg_data:
