services:
  postgres:
    image: postgres:18-alpine
    container_name: veda-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: veda
      POSTGRES_PASSWORD: veda
      POSTGRES_DB: veda
    volumes:
      - pg_data:/var/lib/postgresql
    networks:
      - shared
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veda"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: veda-redis
    restart: unless-stopped
    networks:
      - shared
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: ./veda-backend
    container_name: veda-backend
    restart: unless-stopped
    env_file:
      - ./veda-backend/.env
    ports:
      - "8000:8000"
    networks:
      - shared
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./veda-frontend
    container_name: veda-frontend
    env_file: ./veda-frontend/.env
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - shared
    depends_on:
      - backend

volumes:
  pg_data:

networks:
  shared:
    external: true
